<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Sri Lanka — Lanka Travel AI</title>
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div class="bg-glow"></div>

    <nav class="site-nav">
        <a href="index.html" class="logo">
            <span class="logo-icon">🌴</span>
            <h1>Lanka Travel AI</h1>
        </a>
        <div class="nav-links">
            <a href="explore.html" class="nav-link active">Explore</a>
            <a href="chat.html" class="nav-link">Ask AI</a>
            <a href="planner.html" class="nav-link">Trip Planner</a>
        </div>
    </nav>

    <div class="explore-shell">
        <!-- ------------------------------------------------ filters -->
        <div class="explore-toolbar">
            <div class="toolbar-row">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search a place, region or activity..."
                        autocomplete="off">
                </div>
                <div class="result-count"><b id="count-shown">0</b> of <span id="count-total">0</span> places</div>
                <button class="mobile-map-btn" id="mobile-map-btn">🗺️ Map</button>
                <div style="flex:1"></div>
                <div class="chip-row" id="theme-chips"></div>
            </div>

            <div class="toolbar-row">
                <div class="chip-row">
                    <span class="chip-label">Region</span>
                    <div class="chip-row" id="region-chips"></div>
                </div>
            </div>

            <div class="toolbar-row">
                <div class="chip-row">
                    <span class="chip-label">Review insight</span>
                    <div class="chip-row" id="insight-chips"></div>
                    <span class="chip chip-reset" id="reset-btn">Clear all</span>
                </div>
            </div>
        </div>

        <!-- ------------------------------------------------ list + map -->
        <div class="explore-body" id="explore-body">
            <div class="explore-list" id="place-list"></div>

            <div class="explore-map-pane">
                <div id="explore-map"></div>
                <div class="map-toggle">
                    <button data-layer="dark" class="active">Dark</button>
                    <button data-layer="satellite">Satellite</button>
                    <button data-layer="terrain">Terrain</button>
                </div>
                <div class="map-legend" id="map-legend">
                    <h5>Place type</h5>
                </div>
            </div>
        </div>
    </div>

    <!-- ------------------------------------------------ detail drawer -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
        <div class="drawer-scroll">
            <div class="drawer-hero" id="drawer-hero"></div>
            <div class="drawer-content" id="drawer-content"></div>
        </div>
        <div class="drawer-actions" id="drawer-actions"></div>
    </aside>

    <script src="explore.js?v=1"></script>
</body>

</html>
